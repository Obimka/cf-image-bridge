name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test + bundle (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Offline: the harness stubs env.AI, so no Cloudflare credentials or quota are used.
      - name: Test
        run: npm test

      # Bundles with esbuild only; --dry-run never uploads and needs no credentials.
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Assert the registry was inlined
        run: |
          test -f dist/worker.js || { echo "bundle missing"; exit 1; }
          grep -q 'flux-2-klein-4b' dist/worker.js || { echo "registry not inlined"; exit 1; }
          grep -q 'import .*config/models.json' dist/worker.js && { echo "unresolved registry import"; exit 1; }
          echo "bundle ok ($(wc -c < dist/worker.js) bytes)"

  registry:
    name: registry validates against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate config/models.json
        run: |
          npx --yes ajv-cli@5 validate \
            --spec=draft2020 \
            -s config/models.schema.json \
            -d config/models.json \
            --strict=false
